name: Build
description: |
  Builds the debian package represented by this repo at the ref pointed by the debian-ref argument.

on:
  workflow_dispatch:
    inputs:

      debian-ref:
        description: The debian ref to build. For example branch "qcom/ubuntu/resolute"
        type: string
        required: true
        default: qcom/ubuntu/resolute

      force-docker-build:
        description: Force local pkg-builder instead of Debusine for Debian-family suites
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    uses: qualcomm-linux/qcom-build-utils/.github/workflows/pkg-build-reusable-workflow.yml@dev/pilot-axiom-gate
    with:
      qcom-build-utils-ref: dev/pilot-axiom-gate
      debian-ref: ${{ inputs.debian-ref }}
      force-docker-build: ${{ inputs.force-docker-build }}
      debusine-parent-workspace: ${{ vars.DEBUSINE_PARENT_WORKSPACE }}
    secrets:
      DEBUSINE_USER: ${{ secrets.DEBUSINE_USER }}
      DEBUSINE_TOKEN: ${{ secrets.DEBUSINE_TOKEN }}
